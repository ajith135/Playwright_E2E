name: Playwright Tests
on:
  push:
    branches: [ '**' ]
  workflow_dispatch:
jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.62.1-noble
    env:
      SAUCE_USERNAME: ${{ secrets.SAUCE_USERNAME }}
      SAUCE_PASSWORD: ${{ secrets.SAUCE_PASSWORD }}
      BASE_URL: ${{ vars.BASE_URL }}
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm ci
    - name: Verify required secrets are available
      run: |
        if [ -z "$SAUCE_USERNAME" ]; then echo "::error::SAUCE_USERNAME is empty/not set"; else echo "SAUCE_USERNAME is set"; fi
        if [ -z "$SAUCE_PASSWORD" ]; then echo "::error::SAUCE_PASSWORD is empty/not set"; else echo "SAUCE_PASSWORD is set"; fi
    - name: Run Playwright tests
      run: npx playwright test
    - name: Upload Playwright report
      uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7
